<title>Archive · Night Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@100..900&display=swap">
<style>
/* One curved CRT fills the viewport. Inside it is a detective's office at night, seen from the chair behind the desk:
   the pointer is free to aim (no pointer lock, so no browser banner); pushing it into the edge of the glass turns your
   head, and a drag (mouse or finger) looks around; you pick things up off the desk. Everything you see, the room and
   the on-screen display, is drawn into the tube and bent by it. Invisible real controls sit where the bent picture shows them: plain ones for the on-screen display, and
   "mirrors" (class m) for things in the 3D room, which keyboard and tests can use while the pointer goes straight
   through to the room. The mouse pointer is our own (#cur): a dot, a ring over what can be used, and its name. */
:root { --room: #030303; --osd: #d6d3cb; --ink: #e6dcae; --px: "Handjet", ui-monospace, monospace; color-scheme: dark; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--room); color: var(--osd); font-family: var(--px); overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
.tv { position: fixed; inset: 0; background: #000; }
.screen { position: absolute; inset: 0; overflow: hidden; background: #000; }
.probe { position: absolute; visibility: hidden; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#gl, #flat { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* our own pointer is drawn over the TV; !important beats the inline cursor the room sets on hover */
body.mlook #gl, body.mlook #hits > * { cursor: none !important; }
#cur { position: fixed; left: 0; top: 0; z-index: 9; width: 0; height: 0; pointer-events: none; will-change: transform; }
#cur[hidden] { display: none !important; }
#cur i { position: absolute; display: block; border-radius: 50%; pointer-events: none; }
#cur .dot { left: -3px; top: -3px; width: 6px; height: 6px; background: #f4f2ed; box-shadow: 0 0 0 1.5px rgba(0,0,0,.55), 0 0 6px rgba(244,242,237,.55); transition: transform .12s; }
#cur .ring { left: -13px; top: -13px; width: 26px; height: 26px; box-sizing: border-box; border: 1.5px solid rgba(244,242,237,.92); box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 8px rgba(244,242,237,.35); opacity: 0; transform: scale(.55); transition: opacity .14s, transform .14s; }
#cur.on .ring { opacity: 1; transform: scale(1); }
#cur.on .dot { transform: scale(.55); }
#cur.grab .ring { opacity: .7; transform: scale(.8); border-style: dashed; }
#cur.ui .dot { transform: scale(1.25); }
#curlab { position: absolute; left: 0; top: 20px; transform: translateX(-50%); white-space: nowrap; font: 600 17px/1 var(--px); letter-spacing: .03em; color: #f4f2ed; background: rgba(6,6,6,.74); padding: 4px 9px 3px; text-shadow: 0 0 4px rgba(244,242,237,.45); opacity: 0; transition: opacity .16s; }
#cur.on #curlab.has { opacity: 1; }
#glass { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: block; }
#hits { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
#hits > * { position: absolute; pointer-events: auto; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; opacity: 0; cursor: pointer; font-size: 16px; overflow: hidden; }
#hits > .m { pointer-events: none; }
#hits > input { opacity: 1; caret-color: transparent; outline: none; cursor: text; -webkit-text-fill-color: transparent; }
#hits > input::selection { background: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.flash { animation: flash .32s steps(3) 1; }
@keyframes flash { 0% { filter: brightness(2.1) contrast(1.3); } 100% { filter: none; } }
/* when the 3D graphics can't be drawn: a plain message (soft, over the frozen screen, while the picture comes back) */
#glnote { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 16px; box-sizing: border-box; background: #050505; color: var(--osd); font: 500 22px/1.4 var(--px); letter-spacing: .04em; text-align: center; }
#glnote.soft { background: rgba(5,5,5,.78); font-size: 19px; }
#glnote p { margin: 0; max-width: 30em; }
#glnote button { font: 700 22px/1 var(--px); letter-spacing: .1em; color: #0d0d0e; background: var(--ink); border: 0; padding: 12px 28px 10px; cursor: pointer; }
#glnote button:focus-visible { outline: 2px solid #f4f2ed; outline-offset: 4px; }
.sharebox { position: absolute; z-index: 6; left: 10%; right: 10%; bottom: 16%; min-height: 160px; background: #0d0d0e; color: var(--osd); border: 1px solid var(--ink); font: 15px/1.5 var(--px); padding: 12px; box-sizing: border-box; }
.shareclose { position: absolute; z-index: 7; right: 10%; bottom: calc(16% + 170px); background: #0d0d0e; color: var(--osd); border: 1px solid var(--ink); font: 600 15px var(--px); padding: 6px 12px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>

  <div class="screen" id="screen">
    <canvas id="gl" aria-hidden="true"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="case-data" type="application/json">__CASE__</script>
<script>
(function () {
  "use strict";
  /* ================= the case =================
     Everything on the desk comes from the case file (format v2, v1 still read): drawers, files (kind, object, lines and
     back with [[clip|note]] and {{lead|file}} markup, a "figure" drawing, a tape's "speaker"), files that arrive by
     phone / fax / printer / mail / door once a report part is stamped ("unlock"), the briefing, the inner voice
     ("monologue" on start, open:file, play:file, clip:note, confirm:part, miss:part, arrive:file, overturn:part), the
     report's parts (sealed by "after" until that part is stamped and what it sent is in hand), "overturn" notes, and
     the truth told at the end (headline, how it seemed impossible, how it was possible, the clues read again, epilogue). */
  /* the case comes sealed (page.mjs sealCase): base64, XORed with a keystream from its salt, and each report blank's
     answers only as salted hashes ("acceptH"), so View Source shows no answers; a plain case file still works */
  function h53(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57, i, ch;
    for (i = 0; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  function openCase(raw) {
    var c = JSON.parse(raw); if (!c || !c.sealed) return c;
    var bin = atob(c.data), n = bin.length, u = new Uint8Array(n), s = 0, i;
    for (i = 0; i < c.salt.length; i++) s = (Math.imul(s, 31) + c.salt.charCodeAt(i)) | 0;
    if (!s) s = 0x9e3779b9;
    for (i = 0; i < n; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; u[i] = bin.charCodeAt(i) ^ (s & 255); }
    var out = JSON.parse(new TextDecoder().decode(u)); out.salt = c.salt; return out;
  }
  var CASE = openCase(document.getElementById("case-data").textContent);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var BX = 3.4, BY = 2.9; // tube curvature, set per shape in resize()
  function $(id) { return document.getElementById(id); }
  function norm(s) { return String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
  function osa(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) d[i] = [i];
    for (j = 0; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
      var c = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[a.length][b.length];
  }
  function singular(k) { return k.replace(/ies$/, "y").replace(/(ss|sh|ch|x)es$/, "$1").replace(/([^s])s$/, "$1"); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeBack(t) { var c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  function rnd(seed) { var s = (seed % 2147483646) + 1; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function hash(str) { var h = 7; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 1000003; return h; }

  // [[visible|noteId]] = a phrase you can clip, {{visible|fileId}} = a lead to another file
  var MARK = /\[\[([^\]|]+)\|([^\]]+)\]\]|\{\{([^}|]+)\|([^}]+)\}\}/g;
  function parseLine(s) {
    var out = [], last = 0, m; s = String(s || ""); MARK.lastIndex = 0;
    while ((m = MARK.exec(s))) {
      if (m.index > last) out.push({ t: "text", s: s.slice(last, m.index) });
      if (m[1] !== undefined) out.push({ t: "clip", s: m[1], id: m[2].trim() }); else out.push({ t: "lead", s: m[3], id: m[4].trim() });
      last = MARK.lastIndex;
    }
    if (last < s.length) out.push({ t: "text", s: s.slice(last) });
    return out;
  }
  function plain(s) { return parseLine(s).map(function (p) { return p.s; }).join(""); }

  var FILES = {}, FILE_LIST = [], DRAWERS = (CASE.drawers || []).slice(0, 4), DRAWER = {};
  if (!DRAWERS.length) DRAWERS = [{ id: "files", label: "FILES" }];
  DRAWERS.forEach(function (d, i) { d.i = i; DRAWER[d.id] = d; });
  var KIND_OBJ = { page: "folder", person: "idcard", record: "paper" };
  (CASE.files || []).forEach(function (f, i) {
    f.object = f.object || KIND_OBJ[f.kind] || "paper";
    f.no = i + 1; f.lines = f.lines || []; f.back = f.back || [];
    if (!DRAWER[f.drawer]) f.drawer = DRAWERS[0].id;
    if (f.unlock && !f.unlock.after) f.unlock = null;
    if (f.unlock) f.open = false; // a delivered file is never on the desk from the start: it arrives
    FILES[f.id] = f; FILE_LIST.push(f);
  });
  var NOTES = {};
  Object.keys(CASE.notes || {}).forEach(function (k) { NOTES[k] = { label: String(CASE.notes[k].label || k).toUpperCase(), type: CASE.notes[k].type || "thing" }; });
  FILE_LIST.forEach(function (f) {
    // a person file is a note you can clip whole, unless the case marks it read-only (noClip: never an answer or a lure)
    if (f.kind === "person" && !f.noClip && !NOTES[f.id]) NOTES[f.id] = { label: String(f.title).toUpperCase(), type: "person" };
    f.lines.concat(f.back).forEach(function (l) { parseLine(l).forEach(function (p) { if (p.t === "clip" && !NOTES[p.id]) NOTES[p.id] = { label: p.s.toUpperCase(), type: "thing" }; }); });
  });
  // where each clippable note is written (the files it can be clipped from), for a blank's decoys
  var NOTE_HOME = {};
  FILE_LIST.forEach(function (f) { f.lines.concat(f.back).forEach(function (l) { parseLine(l).forEach(function (p) { if (p.t === "clip") (NOTE_HOME[p.id] = NOTE_HOME[p.id] || []).push(f.id); }); }); });
  var PARTS = (CASE.report && CASE.report.parts) || [];
  // v2 writes "after" as one part id (or null), v1 as a list: both become a list
  PARTS.forEach(function (p) { p.after = p.after == null ? [] : [].concat(p.after).filter(Boolean); p.blanks = p.blanks || {}; Object.keys(p.blanks).forEach(function (b) { p.blanks[b].key = p.id + "." + b; }); });
  var OVERTURN = ((CASE.report && CASE.report.overturn) || []).filter(function (o) { return o && o.after && o.text; });
  var MONO = (CASE.monologue || []).map(function (m, i) { return { i: i, on: String(m.on || "").trim(), text: String(m.text || "") }; }).filter(function (m) { return m.text; });
  var SEARCH = Object.assign({ limit: 5, empty: "NO RECORD ON FILE", too_broad: [] }, CASE.search || {});
  var TRUTH = CASE.truth || {};
  var AGENCY = String(CASE.agency || "CITY POLICE · HOMICIDE").toUpperCase();
  /* the room's few case-dressed things: the town (from the agency) on the phone's card and the chart, the department
     on the door's glass, and "room": { headland: "lighthouse" (a beam sweeps the sky; the default) or "tower" (a dark
     old tower with a gallery, no light), chart: { title, sub, mark } } for the view and the framed chart */
  var ROOMCFG = CASE.room || {}, TOWN = (AGENCY.split(/[\s·]+/)[0] || "CITY"), DEPT = (AGENCY.split("·")[1] || "HOMICIDE").trim();
  if (DEPT === "CID") DEPT = "C.I.D.";
  var HEADLAND = ROOMCFG.headland === "tower" ? "tower" : "lighthouse";
  var CHART = Object.assign({ title: TOWN + " HARBOUR", sub: "APPROACHES · SOUNDINGS IN METRES", mark: "" }, ROOMCFG.chart || {});
  var CASE_NO = pad2(CASE.no != null ? CASE.no : 1);
  var TYPE_NAME = { place: "PLACE", person: "PERSON", time: "TIME", object: "OBJECT", fact: "FACT", phrase: "PHRASE", evidence: "EVIDENCE", year: "YEAR", number: "NUMBER", record: "RECORD", thing: "THING", choice: "ANSWER" };
  var TYPE_GROUP = { place: "PLACES", person: "PEOPLE", time: "TIMES", object: "OBJECTS", fact: "FACTS", phrase: "PHRASES", evidence: "EVIDENCE", year: "YEARS", number: "NUMBERS", record: "RECORDS", thing: "THINGS", choice: "ANSWERS" };
  // the notebook's groups: people first, then times and places (the bones of any alibi), then the rest; a type a case
  // invents is shown under its own name after those
  var TYPE_ORDER = ["person", "time", "place", "object", "evidence", "fact", "phrase", "year", "number", "thing"];
  Object.keys(NOTES).forEach(function (k) { var t = NOTES[k].type; if (TYPE_ORDER.indexOf(t) < 0) TYPE_ORDER.push(t); });
  function typeName(t) { return TYPE_NAME[t] || String(t || "NOTE").toUpperCase(); }
  function typeGroup(t) { return TYPE_GROUP[t] || String(t || "NOTES").toUpperCase(); }
  // a blank with "choices" is answered by reasoning, not from the notebook: its value is stored as "=" + the choice
  function noteLabel(id) { if (String(id).charAt(0) === "=") return String(id).slice(1).toUpperCase(); return NOTES[id] ? NOTES[id].label : String(id).toUpperCase(); }
  // a sealed case knows its answers only as hashes: what is in the blank is hashed the same way and looked for
  function blankRight(bl, v) {
    if (v == null || v === "") return false;
    if (bl.acceptH) { var w = bl.choices ? String(v).replace(/^=/, "").toLowerCase() : String(v); return bl.acceptH.indexOf(h53(CASE.salt + "|" + bl.key + "|" + w)) >= 0; }
    return (bl.accept || []).some(function (a) { return bl.choices ? "=" + String(a).toLowerCase() === String(v).toLowerCase() : a === v; });
  }
  function overturnFor(pid) { return OVERTURN.filter(function (o) { return o.after === pid; }).map(function (o) { return o.text; }).join(" "); }
  function partOpen(p) { return (p.after || []).every(function (id) { return S.confirmed[id]; }) && !waitingOn(p); }
  // the evidence a stamp sends has to be in your hands before the part after it opens
  function waitingOn(p) { return (p.after || []).some(function (id) { return FILE_LIST.some(function (f) { return f.unlock && f.unlock.after === id && !(S.unlocked[f.id] && !S.pending[f.id]); }); }); }
  // "click" for a mouse, "tap" for a finger
  var coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  function TAP() { return ui.touch || (ui.touch === undefined && coarse) ? "TAP" : "CLICK"; }
  function isTouch() { return ui.touch || (ui.touch === undefined && coarse); }

  /* ================= saved progress ================= */
  // one save per case (v2 desk); ?reset starts the case again
  var KEY = "desk-case:v2:" + CASE.id;
  if (/[?&]reset\b/.test(location.search)) { try { localStorage.removeItem(KEY); history.replaceState(null, "", location.pathname + location.search.replace(/[?&]reset\b(=[^&]*)?/, "").replace(/^&/, "?") + location.hash); } catch (e) {} }
  // pending: files on their way to you (fileId -> phone|fax|printer|mail|door), until you take them; said: monologue
  // lines already spoken; played: tapes heard to the end; loaded: the tape in the recorder
  // delivered: deliveries whose scene began (the phone rang, the fax woke), so a reload keeps their order; clock: the
  // night's time in minutes (see NIGHT); revealAt: the step of the closing explanation reached
  function fresh() { return { debriefed: false, unlocked: {}, seen: {}, notes: [], filled: {}, confirmed: {}, verdict: {}, misses: 0, history: [], printed: {}, home: {}, done: false, cardSeen: false, held: 0, partMisses: {}, pending: {}, said: {}, played: {}, overturned: {}, loaded: null, revealed: false, delivered: {}, clock: null, revealAt: 0 }; }
  var S = (function () { try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.unlocked && Array.isArray(v.notes)) return Object.assign(fresh(), v); } catch (e) {} return fresh(); })();
  // "printer" is never a home worth keeping: a page left mid-print (older saves stored it) goes back where it lives;
  // a delivered file lives on the desk once it has come

  var ON_PRINTER = {}; // in memory only: the file the printer (or fax) just pushed out, until you take it
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function hasNote(id) { return S.notes.indexOf(id) >= 0; }
  function inHand(id) { return S.unlocked[id] && !S.pending[id]; }
  function unlockedIn(d) { return FILE_LIST.filter(function (f) { return f.drawer === d && inHand(f.id) && S.home[f.id] === "drawer" && !ON_PRINTER[f.id]; }); }
  // ghost folders in a drawer stand for files you can still find there; one that will be delivered is not shown
  function lockedIn(d) { return FILE_LIST.filter(function (f) { return f.drawer === d && !S.unlocked[f.id] && !f.unlock; }); }
  function filesOpened() { return FILE_LIST.filter(function (f) { return S.seen[f.id]; }).length; }

  /* ================= the night: a clock that belongs to the case =================
     The desk opens at the time the file stands at (night.start, e.g. 2200; 2140 if the case gives none), and the case
     closes at night.close, which may be past midnight (0230 is read as the small hours after the start, as is a
     delivery's unlock.at that is earlier in the day than six hours before the start). The night moves on as you work, a little with
     each clip, lead or print and more with a stamp, and a delivery comes at the time on its own paper (unlock.at): the
     clock never runs past the next one's time before it comes. The case closes at night.close. The wall clock shows it. */
  function hm(s) { var m = /^(\d{1,2}):?(\d{2})$/.exec(String(s == null ? "" : s).trim()); return m ? +m[1] * 60 + +m[2] : null; }
  var NIGHT = (function () { var n = CASE.night || {}, st = hm(n.start), cl = hm(n.close); if (st == null) st = 21 * 60 + 40; if (cl == null) cl = st + 150; if (cl < st) cl += 1440; return { start: st, close: cl }; })();
  function atOf(f) { var t = f && f.unlock && hm(f.unlock.at); if (t == null) return null; if (t < NIGHT.start - 360) t += 1440; return t; }
  if (S.clock == null || S.clock < NIGHT.start) S.clock = NIGHT.start;
  if (!S.delivered) S.delivered = {};
  function clockCap() {
    if (S.revealed) return NIGHT.close;
    var next = null;
    FILE_LIST.forEach(function (f) { var t = atOf(f); if (t != null && !S.delivered[f.id] && !inHand(f.id) && (next == null || t < next)) next = t; });
    return next != null ? next - 3 : NIGHT.close - (S.done ? 4 : 14);

  function passTime(min) { var cap = clockCap(); if (S.clock < cap) S.clock = Math.min(cap, S.clock + min); }
  function clockTo(t) { if (t != null && t > S.clock) S.clock = t; }

  /* ================= sound: synthesized foley and a room you can hear, no files =================
     Two buses into one master: the room (rain, hum, the clock, cars going by) and the foreground (paper, drawers,
     the phone). Sounds that come from somewhere in the room are panned by where your head is turned, so turning
     toward the window brings the rain round in front of you; the room ducks while you read. */
  var AC = null, soundOn = true, MASTER = null, ROOMBUS = null, FX = null, AMB = null;
  try { soundOn = localStorage.getItem("desk:sound") !== "off"; } catch (e) {}

    if (!soundOn) return null;

      try {
        var C = window.AudioContext || window.webkitAudioContext;
        if (C) { AC = new C(); MASTER = AC.createGain(); MASTER.gain.value = .9; MASTER.connect(AC.destination); ROOMBUS = AC.createGain(); ROOMBUS.gain.value = 1; ROOMBUS.connect(MASTER); FX = AC.createGain(); FX.gain.value = 1; FX.connect(MASTER); }
      } catch (e) { AC = null; }

    if (AC && !AMB && AC.state === "running") { try { startRoom(); } catch (e) {} }

  }
  var noiseBuf = null, brownBuf = null;
  function noise(ac) {
    if (noiseBuf) return noiseBuf;
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return noiseBuf;
  }
