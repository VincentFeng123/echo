<title>White Rabbit Echo</title>
<meta name="claude:viewport-fit-sides" content="cover">

/* Layout: one curved CRT fills the viewport. Everything you see (tapes, on-screen display, the round) is drawn into the tube and bent by it; invisible real buttons, links and a text box sit where the bent picture shows them. */

  color-scheme: dark;

.tv { position: fixed; inset: 0; background: #000; }
.screen { position: absolute; inset: 0; overflow: hidden; background: #000; }

#glass { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: block; }
#hits { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
#hits > * { position: absolute; pointer-events: auto; margin: 0; padding: 0; border: 0; background: transparent; color: transparent; opacity: 0; cursor: pointer; font-size: 16px; }
#hits > input { opacity: 1; caret-color: transparent; outline: none; cursor: text; -webkit-text-fill-color: transparent; }
#hits > input::selection { background: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.flash { animation: flash .32s steps(3) 1; }
@keyframes flash { 0% { filter: brightness(2.3) contrast(1.4); } 100% { filter: none; } }
.sharebox { position: absolute; z-index: 6; left: 10%; right: 10%; bottom: 16%; min-height: 140px; background: #0d0d0e; color: var(--osd); border: 1px solid var(--ink); font: 14px/1.5 var(--px); padding: 12px; }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>

</div>
